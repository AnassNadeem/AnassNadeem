<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220">
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <pattern id="dashborder" x="0" y="0" width="36" height="1" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="24" height="1" fill="#E8002D"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="860" height="220" fill="#0D0D0D"/>
  <!-- grid overlay -->
  <rect width="860" height="220" fill="url(#grid)"/>

  <!-- top red micro-line accent -->
  <rect x="0" y="0" width="860" height="2" fill="#E8002D" opacity="0.6"/>

  <!-- sector eyebrow -->
  <text
    x="430" y="68"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="11"
    letter-spacing="4"
    fill="#E8002D"
    font-weight="400"
  >· BRUNEL UNIVERSITY LONDON · BSc COMPUTER SCIENCE ·</text>

  <!-- name — large, red, bold -->
  <text
    x="430" y="128"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="46"
    font-weight="700"
    letter-spacing="3"
    fill="#E8002D"
  >MUHAMMAD ANAS NADEEM</text>

  <!-- subtitle -->
  <text
    x="430" y="164"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="13"
    letter-spacing="2"
    fill="#888884"
    font-weight="400"
  >AI Systems  ·  Physical AI  ·  Race Strategy  ·  Open to Placements</text>

  <!-- dashed red bottom border -->
  <rect x="0" y="216" width="860" height="3" fill="url(#dashborder)"/>
</svg>