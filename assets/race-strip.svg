<svg xmlns="http://www.w3.org/2000/svg" width="860" height="38" viewBox="0 0 860 38">
  <defs>
    <pattern id="dashes" x="0" y="0" width="36" height="1" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="24" height="1" fill="#2A2A2A"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="860" height="38" fill="#0D0D0D"/>

  <!-- centre dashed line -->
  <rect x="0" y="18" width="860" height="1" fill="url(#dashes)"/>

  <!-- sector marker dots (static, dimmed) -->
  <circle cx="215" cy="19" r="3.5" fill="#E8002D" opacity="0.25"/>
  <circle cx="430" cy="19" r="3.5" fill="#E8002D" opacity="0.25"/>
  <circle cx="645" cy="19" r="3.5" fill="#E8002D" opacity="0.25"/>

  <!-- sector labels -->
  <text x="215" y="10" text-anchor="middle" font-family="monospace" font-size="7" fill="#444" letter-spacing="2">S1</text>
  <text x="430" y="10" text-anchor="middle" font-family="monospace" font-size="7" fill="#444" letter-spacing="2">S2</text>
  <text x="645" y="10" text-anchor="middle" font-family="monospace" font-size="7" fill="#444" letter-spacing="2">S3</text>

  <!-- animated car group using animateMotion -->
  <g id="car">
    <!-- halo / DRS glow -->
    <ellipse cx="0" cy="0" rx="34" ry="5" fill="#E8002D" opacity="0.08"/>
    <!-- floor / chassis -->
    <rect x="-28" y="-4" width="56" height="8" rx="2" fill="#E8002D"/>
    <!-- nose cone -->
    <polygon points="28,-2 38,0 28,2" fill="#CC0022"/>
    <!-- cockpit -->
    <rect x="-4" y="-7" width="18" height="5" rx="1" fill="#F5F5F0"/>
    <!-- rear wing -->
    <rect x="-30" y="-7" width="10" height="2" rx="1" fill="#B8001F"/>
    <!-- front wing -->
    <rect x="22" y="-6" width="14" height="2" rx="1" fill="#B8001F"/>
    <!-- wheels -->
    <circle cx="-18" cy="5" r="4" fill="#1A1A1A" stroke="#555" stroke-width="1"/>
    <circle cx="16" cy="5" r="4" fill="#1A1A1A" stroke="#555" stroke-width="1"/>
    <circle cx="-18" cy="5" r="1.5" fill="#666"/>
    <circle cx="16" cy="5" r="1.5" fill="#666"/>
    <!-- exhaust trail -->
    <ellipse cx="-34" cy="0" rx="8" ry="2" fill="#E8002D" opacity="0.15"/>
    <ellipse cx="-44" cy="0" rx="6" ry="1.5" fill="#E8002D" opacity="0.07"/>

    <animateMotion
      dur="6s"
      repeatCount="indefinite"
      path="M-60,19 L920,19"
      calcMode="linear"
    />
  </g>

  <!-- sector flash overlays that light up as car passes -->
  <!-- S1 flash -->
  <circle cx="215" cy="19" r="3.5" fill="#22FF88" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.24;0.25;0.27;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <!-- S2 flash -->
  <circle cx="430" cy="19" r="3.5" fill="#22FF88" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.49;0.50;0.52;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <!-- S3 flash -->
  <circle cx="645" cy="19" r="3.5" fill="#22FF88" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.74;0.75;0.77;1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>