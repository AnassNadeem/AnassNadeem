<svg xmlns="http://www.w3.org/2000/svg" width="860" height="40" viewBox="0 0 860 40">
  <defs>
    <pattern id="dashes" x="0" y="0" width="36" height="1" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="24" height="1" fill="#2A2A2A"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="860" height="40" fill="#0D0D0D"/>

  <!-- centre dashed line -->
  <rect x="0" y="19" width="860" height="1" fill="url(#dashes)"/>

  <!-- sector labels -->
  <text x="215" y="10" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#333" letter-spacing="2">S1</text>
  <text x="430" y="10" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#333" letter-spacing="2">S2</text>
  <text x="645" y="10" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#333" letter-spacing="2">S3</text>

  <!-- sector marker dots (dim) -->
  <circle cx="215" cy="20" r="3" fill="#E8002D" opacity="0.2"/>
  <circle cx="430" cy="20" r="3" fill="#E8002D" opacity="0.2"/>
  <circle cx="645" cy="20" r="3" fill="#E8002D" opacity="0.2"/>

  <!-- animated F1 car -->
  <g id="car">
    <!-- exhaust glow -->
    <ellipse cx="-38" cy="0" rx="10" ry="2.5" fill="#E8002D" opacity="0.12"/>
    <ellipse cx="-50" cy="0" rx="7" ry="1.5" fill="#E8002D" opacity="0.06"/>
    <!-- floor/chassis -->
    <rect x="-28" y="-4" width="56" height="8" rx="2" fill="#E8002D"/>
    <!-- nose -->
    <polygon points="28,-2 40,0 28,2" fill="#CC0022"/>
    <!-- cockpit -->
    <rect x="-2" y="-8" width="18" height="6" rx="1" fill="#F0F0EE"/>
    <!-- rear wing -->
    <rect x="-30" y="-8" width="10" height="2.5" rx="1" fill="#B8001F"/>
    <!-- front wing -->
    <rect x="24" y="-7" width="14" height="2.5" rx="1" fill="#B8001F"/>
    <!-- sidepods -->
    <rect x="-18" y="-3" width="12" height="2" rx="1" fill="#CC0022"/>
    <!-- wheels -->
    <circle cx="-17" cy="5.5" r="4.5" fill="#1A1A1A" stroke="#555" stroke-width="1.2"/>
    <circle cx="15" cy="5.5" r="4.5" fill="#1A1A1A" stroke="#555" stroke-width="1.2"/>
    <circle cx="-17" cy="5.5" r="1.8" fill="#444"/>
    <circle cx="15" cy="5.5" r="1.8" fill="#444"/>

    <animateMotion dur="5.5s" repeatCount="indefinite" calcMode="linear">
      <mpath/>
    </animateMotion>
    <animateMotion dur="5.5s" repeatCount="indefinite" calcMode="linear"
      path="M-60,20 L920,20"/>
  </g>

  <!-- sector flashes green as car passes -->
  <circle cx="215" cy="20" r="3" fill="#22FF88" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0.8;0;0" keyTimes="0;0.22;0.235;0.25;0.27;1" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="20" r="3" fill="#22FF88" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0.8;0;0" keyTimes="0;0.47;0.485;0.50;0.52;1" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="645" cy="20" r="3" fill="#22FF88" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0.8;0;0" keyTimes="0;0.72;0.735;0.75;0.77;1" dur="5.5s" repeatCount="indefinite"/>
  </circle>
</svg>